# Application Configuration
spring.application.name=invitation-backend
server.port=8088
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true
admin.username=${ADMIN_USERNAME:}
admin.password=${ADMIN_PASSWORD:}

# Development by default; production should set SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Google Mail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GOOGLE_MAIL_USERNAME:}
spring.mail.password=${GOOGLE_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Default invitation metadata
invitation.sender-name=Hà Lê Tín
invitation.default-recipient=
invitation.event-title=LỄ TỐT NGHIỆP ĐẠI HỌC
invitation.event-date=Thứ Bảy, 28 Tháng 11, 2026
invitation.event-time=09:30 – 13:30
invitation.event-venue=Hội trường A5 - Trường Đại học Bách Khoa - Đại học Quốc Gia TP.HCM
invitation.event-address=268 Lý Thường Kiệt, Phường Diên Hồng, TP. Hồ Chí Minh
